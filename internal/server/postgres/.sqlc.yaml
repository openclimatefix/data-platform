version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries"
    schema: "sql/migrations"
    gen:
      go:
        out: "gen"
        sql_package: "pgx/v5"
        sql_driver: "github.com/jackc/pgx/v5"
        emit_pointers_for_null_types: true
        emit_sql_as_comment: false
        query_parameter_limit: 0
        emit_methods_with_db_argument: false
        emit_empty_slices: true
        emit_interface: true
        emit_exported_queries: true
        overrides:
          - column: "*.p02_sip"
            go_type:
              type: "int16"
              pointer: true
          - column: "*.p10_sip"
            go_type:
              type: "int16"
              pointer: true
          - column: "*.p25_sip"
            go_type:
              type: "int16"
              pointer: true
          - column: "*.p50_sip"
            go_type:
              type: "int16"
          - column: "*.p75_sip"
            go_type:
              type: "int16"
              pointer: true
          - column: "*.p90_sip"
            go_type:
              type: "int16"
              pointer: true
          - column: "*.p98_sip"
            go_type:
              type: "int16"
              pointer: true
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "google.golang.org/protobuf/types/known/structpb"
              type: "Struct"
              pointer: true
          - db_type: "jsonb"
            nullable: false
            go_type:
              import: "google.golang.org/protobuf/types/known/structpb"
              type: "Struct"
              pointer: true

