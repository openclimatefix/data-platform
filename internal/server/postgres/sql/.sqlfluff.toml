[sqlfluff]
dialect = postgres
max_line_length = 120
rules = aliasing, ambiguous, capitalisation, convention, layout, structure, references
exclude_rules = ST07, AL03, AL07, LT08, RF02, RF03
processes = 4

[sqlfluff:indentation]
indented_using_on = False
allow_implicit_indents = True
indented_on_contents = True
tab_space_size = 4
indent_units = space
indented_joins = True
no_trailing_whitespace = True

[sqlfluff:rules:capitalisation.keywords]
capitalisation_policy = upper

[sqlfluff:rules:capitalisation.identifiers]
extended_capitalisation_policy = lower

[sqlfluff:rules:capitalisation.functions]
extended_capitalisation_policy = upper

[sqlfluff:rules:capitalisation.literals]
capitalisation_policy = upper

[sqlfluff:rules:capitalisation.types]
extended_capitalisation_policy = upper

[sqlfluff:rules:aliasing.table]
aliasing.table = explicit

[sqlfluff:rules:aliasing.column]
aliasing.column = explicit

[sqlfluff:rules:ambiguous.join]
fully_qualify_join_types = both

[sqlfluff:rules:layout.commas]
line_position = trailing

[sqlfluff:rules:layout.functions]
no_space_after_function_name = true
