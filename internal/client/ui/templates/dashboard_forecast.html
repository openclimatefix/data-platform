<article style="display: flex; flex-direction: column; flex-grow: 1;">
    <div class="panel-header">
        <strong id="chart-title">Nation Forecast: {{ .Location.LocationName }}</strong> 
        <small id="chart-subtitle">{{ .Location.LocationUuid }}</small>
    </div>
    
    {{ if not .Series }}
        <div class="empty-state" style="min-height: 320px;">
            No forecast data found.
        </div>
    {{ else }}
        <figure style="margin: 0; flex-grow: 1; display: flex; flex-direction: column;">
            <div id="forecastChart" style="flex-grow: 1; min-height: 320px; width: 100%;"></div>
        </figure>
        <script>
            (function() {
                var chartDom = document.getElementById('forecastChart');
                if (window.forecastChartInstance) window.forecastChartInstance.dispose();
                var myChart = echarts.init(chartDom);
                window.forecastChartInstance = myChart;

                var labels = {{ .Labels | toJSON }};
                var seriesConfig = {{ .Series | toJSON }};
                
                // For dashboard, we only expect 1 forecaster, but handle it cleanly anyway
                var s = seriesConfig[0];
                var seriesData = [{
                    name: s.name,
                    type: 'line',
                    data: s.data,
                    smooth: 0.2,
                    showSymbol: false,
                    lineStyle: { color: '#7a9374', width: 2 },
                    itemStyle: { color: '#7a9374' }
                }];

                if (s.hasBands) {
                    seriesData.push({
                        name: s.name + " Band Lower", type: 'line', data: s.bandLower,
                        lineStyle: { opacity: 0 }, stack: "band_0", showSymbol: false, tooltip: { show: false }
                    });
                    seriesData.push({
                        name: s.name + " Band", type: 'line', data: s.bandDiff,
                        lineStyle: { opacity: 0 }, areaStyle: { color: '#7a9374', opacity: 0.2 },
                        stack: "band_0", showSymbol: false, tooltip: { show: false }
                    });
                }

                var formatValue = function(value) {
                    if (value === null || value === undefined || isNaN(value)) return 'N/A';
                    var num = Number(value);
                    if (num >= 1e12) return (num / 1e12).toFixed(1) + ' TW';
                    if (num >= 1e9) return (num / 1e9).toFixed(1) + ' GW';
                    if (num >= 1e6) return (num / 1e6).toFixed(1) + ' MW';
                    if (num >= 1e3) return (num / 1e3).toFixed(0) + ' kW';
                    return num.toFixed(0) + ' W';
                };

                var isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var gridColor = isDarkMode ? '#3a3a3c' : '#ebebeb';
                var textColor = isDarkMode ? '#ebebf5' : '#8e8e93';

                // Initial time scrubber line
                var markLineData = {
                    data: [{ xAxis: 0, label: { show: false }, lineStyle: { color: textColor, type: 'dashed', width: 2, opacity: 0.7 } }],
                    symbol: ['none', 'none'], animation: false
                };
                seriesData[0].markLine = markLineData;

                var option = {
                    backgroundColor: 'transparent',
                    tooltip: {
                        trigger: 'axis',
                        formatter: function(params) {
                            if (!params || params.length === 0) return '';
                            var tooltipStr = '<strong>' + params[0].axisValue + '</strong><br/>';
                            var main = params.filter(p => !p.seriesName.includes('Band'))[0];
                            if (main) {
                                tooltipStr += '<div><span style="display:inline-block;margin-right:4px;border-radius:10px;width:10px;height:10px;background-color:' + main.color + ';"></span>';
                                tooltipStr += '<strong>' + formatValue(main.value) + '</strong></div>';
                            }
                            return tooltipStr;
                        }
                    },
                    grid: { left: 20, right: 40, top: 20, bottom: 20, containLabel: true },
                    xAxis: { type: 'category', data: labels, axisLabel: { color: textColor }, axisTick: { show: false }, axisLine: { show: false } },
                    yAxis: { type: 'value', splitLine: { lineStyle: { type: 'dashed', color: gridColor } }, axisLabel: { color: textColor, formatter: formatValue } },
                    series: seriesData
                };
                myChart.setOption(option);
                
                myChart.getZr().on('click', function(params) {
                    var pointInPixel = [params.offsetX, params.offsetY];
                    if (myChart.containPixel('grid', pointInPixel)) {
                        var pointInGrid = myChart.convertFromPixel({seriesIndex: 0}, pointInPixel);
                        var xIndex = pointInGrid[0];
                        
                        var chartOpt = myChart.getOption();
                        chartOpt.series[0].markLine.data[0].xAxis = xIndex;
                        chartOpt.animation = false;
                        myChart.setOption(chartOpt, {replaceMerge: ['series']});
                        
                        // Update Map timestamp via async fetch
                        var targetLabel = labels[xIndex];
                        var mapEl = document.getElementById('map-time-label');
                        if (mapEl) mapEl.innerHTML = targetLabel;

                        var timestamp = window.timestampsMap[xIndex]; 
                        if (timestamp) {
                            fetch('/api/dashboard/map-snapshot?timestamp=' + timestamp + '&nation_uuid=' + window.dashboardNationUuid + '&energy_source=' + window.dashboardEnergySource + '&forecaster=' + encodeURIComponent(window.dashboardForecaster))
                                .then(r => r.json())
                                .then(data => {
                                    if (window.mapInstance) {
                                        var mOpt = window.mapInstance.getOption();
                                        if (mOpt && mOpt.series && mOpt.series.length > 0) {
                                            mOpt.series[0].data = data;
                                            window.mapInstance.setOption(mOpt);
                                        }
                                    }
                                });
                        }
                    }
                });

                var ro = new ResizeObserver(() => {
                    if (chartDom.clientWidth > 0 && chartDom.clientHeight > 0) {
                        myChart.resize();
                    }
                });
                ro.observe(chartDom);
                
                // Fetch the initial map data explicitly aligned to the chart's starting timestamp
                if (window.timestampsMap && window.timestampsMap.length > 0) {
                    var firstTs = window.timestampsMap[0];
                    fetch('/api/dashboard/map-snapshot?timestamp=' + firstTs + '&nation_uuid=' + window.dashboardNationUuid + '&energy_source=' + window.dashboardEnergySource + '&forecaster=' + encodeURIComponent(window.dashboardForecaster))
                        .then(r => r.json())
                        .then(data => {
                            if (window.mapInstance) {
                                var mOpt = window.mapInstance.getOption();
                                if (mOpt && mOpt.series && mOpt.series.length > 0) {
                                    mOpt.series[0].data = data;
                                    window.mapInstance.setOption(mOpt);
                                }
                            }
                        });
                }
            })();
        </script>
    {{ end }}
</article>

<div id="map-panel" hx-swap-oob="innerHTML">
    <div class="panel-header">
        <strong>GSP Generation Map</strong>
        <small id="map-time-label">{{ index .Labels 0 }}</small>
    </div>
    <div id="map" class="map-container"></div>
    <script>
        window.timestampsMap = {{ .Timestamps | toJSON }};
        window.dashboardEnergySource = "{{ .EnergySource }}";
        window.dashboardForecaster = "{{ .Forecaster }}";
        window.dashboardNationUuid = "{{ .Location.LocationUuid }}";
        window.dashboardTimeWindow = "{{ .TimeWindow }}";
        window.dashboardHorizon = "{{ .Horizon }}";

        (function() {
            var mapDom = document.getElementById('map');
            if (window.mapInstance) window.mapInstance.dispose();
            var myMap = echarts.init(mapDom);
            window.mapInstance = myMap;

            var geojsonData = {{ .GSPGeoJSON }};
            var initialMapData = {{ .InitialMapData | toJSON }}; // [{name: 'uuid', value: 0.5}, ...]

            if (geojsonData && geojsonData.features) {
                window.uuidToName = {};
                // Ensure ECharts can match the data array to the GeoJSON features by assigning 'name' strictly to the UUID
                geojsonData.features.forEach(function(f) {
                    if (!f.properties) f.properties = {};
                    var uuid = f.id || f.properties.geometry_uuid || f.properties.uuid;
                    if (!uuid && f.properties.name) uuid = f.properties.name;
                    var name = f.properties.geometry_name || f.properties.location_name || uuid || 'Unknown GSP';
                    if (uuid) {
                        window.uuidToName[uuid] = name;
                        // Important: HK example uses nameMap to map arbitrary data 'name' to the property name.
                        // We will set f.properties.name to the UUID so ECharts can match it with data[].name = UUID.
                        f.properties.name = uuid; 
                    }
                });
                echarts.registerMap('gspMap', geojsonData);
                
                var isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var panelBgColor = isDarkMode ? '#2c2c2e' : '#ffffff';

                var option = {
                    tooltip: {
                        trigger: 'item',
                        showDelay: 0,
                        transitionDuration: 0.2,
                        formatter: function(params) {
                            var title = 'Unknown GSP';
                            if (params.name && window.uuidToName && window.uuidToName[params.name]) {
                                title = window.uuidToName[params.name];
                            } else if (params.name) {
                                title = params.name;
                            }

                            if (!params.data) return '<strong>' + title + '</strong><br/>No Data';
                            var val = params.data.value;
                            if (isNaN(val) || val === null) return '<strong>' + title + '</strong><br/>No Data';
                            
                            var cap = params.data.capacity || 0;
                            var gen = val * cap;
                            
                            var formatValue = function(num) {
                                if (num >= 1e12) return (num / 1e12).toFixed(1) + ' TW';
                                if (num >= 1e9) return (num / 1e9).toFixed(1) + ' GW';
                                if (num >= 1e6) return (num / 1e6).toFixed(1) + ' MW';
                                if (num >= 1e3) return (num / 1e3).toFixed(0) + ' kW';
                                return num.toFixed(0) + ' W';
                            };

                            return '<strong>' + title + '</strong><br/>' +
                                   'Generation: ' + formatValue(gen) + ' (' + (val * 100).toFixed(1) + '%)<br/>' +
                                   'Capacity: ' + formatValue(cap);
                        }
                    },
                    visualMap: {
                        left: 'right',
                        bottom: 'bottom',
                        min: 0,
                        max: 1.0,
                        text: ['Max (100%)', 'Min (0%)'],
                        realtime: true, // Enables immediate map updating when dragging handles
                        calculable: true,
                        inRange: {
                            color: [
                                '#f4f5f7',
                                '#fae19b',
                                '#f2a900',
                                '#a87500',
                                '#5e4200'
                            ]
                        },
                        formatter: function (value) {
                            return (value * 100).toFixed(0) + '%';
                        }
                    },
                    series: [{
                        name: 'GSP Generation',
                        type: 'map',
                        map: 'gspMap',
                        roam: 'scale',
                        scaleLimit: { min: 1 },
                        label: { show: false },
                        select: { label: { show: false } },
                        itemStyle: {
                            borderColor: panelBgColor,
                            borderWidth: 0.5
                        },
                        emphasis: {
                            label: { show: false },
                            itemStyle: {
                                areaColor: '#1095c1', // Use the blue accent color for hover emphasis to contrast with the yellow map
                                borderColor: '#1c1c1e',
                                borderWidth: 1
                            }
                        },
                        data: initialMapData
                    }]
                };
                myMap.setOption(option);

                // Map Drilldown to Chart
                myMap.on('click', function(params) {
                    if (params.name) {
                        // The region name in ECharts corresponds to the feature.properties.name, which we'll set to UUID
                        var gspUuid = params.name;
                        // HTMX AJAX request to swap the chart!
                        htmx.ajax('GET', '/components/dashboard/gsp-timeseries?location_uuid=' + gspUuid + '&energy_source=' + window.dashboardEnergySource + '&forecaster=' + encodeURIComponent(window.dashboardForecaster) + '&time_window=' + encodeURIComponent(window.dashboardTimeWindow) + '&horizon_mins=' + window.dashboardHorizon, {target: '#chart-panel'});
                    }
                });

                var roMap = new ResizeObserver(() => {
                    if (mapDom.clientWidth > 0 && mapDom.clientHeight > 0) {
                        myMap.resize();
                    }
                });
                roMap.observe(mapDom);
            } else {
                mapDom.innerHTML = '<div class="empty-state">No GSP boundary data found.</div>';
            }
        })();
    </script>
</div>
