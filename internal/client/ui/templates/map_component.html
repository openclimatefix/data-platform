{{ define "map_component" }}
    <div class="panel-header">
        {{ if .IsInteractiveMap }}
        <strong>GSP Generation Map</strong>
        <small id="{{ .MapID }}-time-label">{{ index .Labels 0 }}</small>
        {{ else }}
        <strong>Location Map</strong>
        <small id="{{ .MapID }}-time-label">{{ if .Location.Latlng }}{{ .Location.Latlng.Latitude }}, {{ .Location.Latlng.Longitude }}{{ else }}Geometry{{ end }}</small>
        {{ end }}
    </div>
    <div id="{{ .MapID }}" class="map-container"></div>
    <script type="application/json" id="{{ .MapID }}-config">
    {{ if .IsInteractiveMap }}
    {
        "geojson": {{ .GeoJSON }},
        "locationUuid": "{{ .Location.LocationUuid }}",
        "energySource": "{{ .EnergySource }}",
        "timeWindow": {{ .TimeWindow | toJSON }},
        "firstForecaster": {{ .FirstForecaster | toJSON }},
        "timestamps": {{ .Timestamps | toJSON }}
    }
    {{ else }}
    {
        "geojson": {{ .GeoJSON }},
        "isPolygon": {{ if .IsPolygon }}true{{ else }}false{{ end }},
        "avgFraction": {{ if .AvgFraction }}{{ printf "%.4f" .AvgFraction }}{{ else }}1.0{{ end }},
        "lat": {{ if .Location.Latlng }}{{ .Location.Latlng.Latitude }}{{ else }}0{{ end }},
        "lng": {{ if .Location.Latlng }}{{ .Location.Latlng.Longitude }}{{ else }}0{{ end }},
        "hasLatlng": {{ if .Location.Latlng }}true{{ else }}false{{ end }},
        "latlngLabel": {{ if .Location.Latlng }}{{ printf "%v, %v" .Location.Latlng.Latitude .Location.Latlng.Longitude | toJSON }}{{ else }}""{{ end }}
    }
    {{ end }}
    </script>
    <script>
        {{ if .IsInteractiveMap }}
        window.mountChoroplethMap('{{ .MapID }}', '{{ .MapID }}-config');
        {{ else }}
        window.mountLocationMap('{{ .MapID }}', '{{ .MapID }}-config');
        {{ end }}
    </script>
{{ end }}
