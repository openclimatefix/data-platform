{{ template "header" . }}

<main class="dashboard-grid" style="grid-template-columns: 1fr;">
    <div id="location-results" style="display: contents;"
        {{ if .DefaultLocationUUID }}
        hx-get="/components/location_details?location_uuid={{ .DefaultLocationUUID }}&energy_source={{ .DefaultEnergySource }}"
        hx-trigger="load, locationUpdated from:body"
        {{ end }}>
        
        <div class="panel empty-state" style="min-height: 400px;">
            {{ if .DefaultLocationUUID }}
            <span class="htmx-indicator text-muted" style="display: inline;"><i>Loading location details...</i></span>
            {{ else }}
            Please select a location and energy source on the Forecasts page first.
            {{ end }}
        </div>
    </div>
</main>

{{ template "footer" . }}
