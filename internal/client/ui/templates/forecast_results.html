<article class="flex-col flex-grow min-h-0">
    <div class="panel-header">
        <strong>Forecast Generation</strong> 
        <small>
            {{ .Location.LocationName }} ({{ .Location.LocationUuid }}) 
            <a href="/locations?location_uuid={{ .Location.LocationUuid }}&energy_source={{ .EnergySource }}" style="margin-left: 8px; color: var(--nc-ac-1); text-decoration: none;">View Details &rarr;</a>
        </small>
    </div>
    
    {{ if not .Series }}
        <div class="empty-state min-h-320">
            No forecast data found for this configuration.
        </div>
    {{ else }}
        <figure class="m-0 flex-grow flex-col min-h-0">
            <div id="forecastChart" class="flex-grow min-h-0 w-full"></div>
        </figure>
        <script>
            (function() {
                var chartDom = document.getElementById('forecastChart');
                if (window.forecastChartInstance) {
                    window.forecastChartInstance.dispose();
                }
                var myChart = echarts.init(chartDom);
                window.forecastChartInstance = myChart;

                var labels = {{ .Labels | toJSON }};
                var seriesConfig = {{ .Series | toJSON }};
                var seriesData = [];
                var colors = ['#7a9374', '#1095c1', '#f2a900', '#e07a5f', '#8e8e93'];

                seriesConfig.forEach(function(s, i) {
                    var color = colors[i % colors.length];
                    
                    var dataObjects = s.data.map(function(val, idx) {
                        var obj = { value: val };
                        if (s.hasBands && s.bandMap && s.bandMap[idx]) {
                            obj.bandMap = s.bandMap[idx];
                        }
                        return obj;
                    });

                    var item = {
                        id: (i === 0) ? 'primaryLine' : s.name + '_Main',
                        name: s.name,
                        type: 'line',
                        data: dataObjects,
                        smooth: 0.2,
                        showSymbol: false,
                        lineStyle: { color: color, width: 2 },
                        itemStyle: { color: color }
                    };

                    if (s.isObservation) {
                        item.lineStyle.type = 'dashed';
                    }
                    seriesData.push(item);

                    if (s.hasBands && s.bands) {
                        var baseOpacity = 0.15;
                        s.bands.forEach(function(band, bIndex) {
                            var opacity = baseOpacity + (bIndex * 0.1); 
                            
                            seriesData.push({
                                id: s.name + "_Band_" + band.lowerName,
                                name: s.name,
                                type: 'line',
                                data: band.lower,
                                lineStyle: { opacity: 0 },
                                stack: "band_" + i + "_" + bIndex,
                                showSymbol: false,
                                tooltip: { show: false }
                            });
                            
                            seriesData.push({
                                id: s.name + "_Band_" + band.upperName,
                                name: s.name,
                                type: 'line',
                                data: band.diff,
                                lineStyle: { opacity: 0 },
                                areaStyle: { color: color, opacity: opacity },
                                stack: "band_" + i + "_" + bIndex,
                                showSymbol: false,
                                tooltip: { show: false },
                                z: 0 - bIndex // Ensure wider bands are drawn underneath narrower bands
                            });
                        });
                    }
                });

                var gridColor = window.getCssVar('--nc-bg-3', '#ebebeb');
                var textColor = window.getCssVar('--nc-text-2', '#8e8e93');
                var panelBgColor = window.getCssVar('--nc-bg-2', '#ffffff');
                var textPrimaryColor = window.getCssVar('--nc-text-1', '#1c1c1e');

                var now = new Date();
                var currentYear = now.getFullYear();
                
                var closestIndex = 0;
                var minDiff = Infinity;
                
                labels.forEach(function(lbl, idx) {
                    var dateStr = currentYear + " " + lbl;
                    var d = new Date(dateStr);
                    var diff = Math.abs(now.getTime() - d.getTime());
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestIndex = idx;
                    }
                });

                var markLineData = {
                    data: [
                        {
                            xAxis: closestIndex,
                            label: { show: false },
                            lineStyle: { color: textColor, type: 'dashed', width: 2, opacity: 0.7 }
                        }
                    ],
                    symbol: ['none', 'none'],
                    animation: false
                };

                if (seriesData.length > 0) {
                    seriesData[0].markLine = markLineData;
                }

                var option = {
                    backgroundColor: 'transparent',
                    legend: {
                        data: seriesConfig.map(s => s.name),
                        icon: 'circle',
                        itemWidth: 10,
                        itemHeight: 10,
                        textStyle: { color: textPrimaryColor, fontSize: 13 },
                        left: 0,
                        top: 0
                    },
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: { type: 'line', lineStyle: { type: 'dotted', color: textColor, opacity: 0.5 } },
                        formatter: function(params) {
                            if (!params || params.length === 0) return '';
                            var tooltipStr = '<strong>' + params[0].axisValue + '</strong><br/>';
                            
                            var mainSeriesParams = params.filter(p => !p.seriesId || !p.seriesId.includes('_Band'));
                            
                            mainSeriesParams.forEach(function(param) {
                                var valStr = window.formatEnergyValue(param.value);
                                var name = param.seriesName;
                                
                                var extraStr = '';
                                if (param.data && param.data.bandMap) {
                                    var bm = param.data.bandMap;
                                    
                                    var levels = [];
                                    var vals = [];
                                    
                                    Object.keys(bm).sort(function(a, b) {
                                        return parseInt(a.substring(1)) - parseInt(b.substring(1));
                                    }).forEach(function(k) {
                                        levels.push(k.substring(1)); // strip the 'p'
                                        var vStr = window.formatEnergyValue(bm[k]);
                                        vals.push(vStr);
                                    });
                                    
                                    if (levels.length > 0) {
                                        var pUnit = vals[vals.length-1].replace(/[\d\.\s]/g, '');
                                        var cleanVals = vals.map((v, idx) => {
                                            if (idx < vals.length - 1 && pUnit && v.endsWith(pUnit)) {
                                                return v.replace(' ' + pUnit, '');
                                            }
                                            return v;
                                        });
                                        extraStr = ' (P' + levels.join('/') + ': ' + cleanVals.join('/') + ')';
                                    }
                                }
                                
                                tooltipStr += '<div style="margin-top: 6px;">';
                                tooltipStr += param.marker;
                                tooltipStr += '<span>' + name + ': </span>';
                                tooltipStr += '<strong>' + valStr + '</strong>';
                                if (extraStr) {
                                    tooltipStr += '<span style="font-size: 0.9em; opacity: 0.8; margin-left: 8px;">' + extraStr + '</span>';
                                }
                                tooltipStr += '</div>';
                            });
                            return tooltipStr;
                        }
                    },
                    grid: {
                        left: 20, right: 40, top: 40, bottom: 40, containLabel: true
                    },
                    dataZoom: [
                        { type: 'inside', xAxisIndex: 0, filterMode: 'none', minValueSpan: 12 },
                        { 
                            type: 'slider', 
                            xAxisIndex: 0, 
                            filterMode: 'none', 
                            bottom: 5, 
                            height: 20,
                            minValueSpan: 12,
                            borderColor: 'transparent',
                            backgroundColor: 'transparent',
                            fillerColor: textPrimaryColor.replace(')', ', 0.1)').replace('rgb', 'rgba').replace('#1c1c1e', 'rgba(28, 28, 30, 0.1)').replace('#ffffff', 'rgba(255, 255, 255, 0.1)'),
                            handleStyle: { color: panelBgColor, borderColor: textPrimaryColor, borderWidth: 1 },
                            moveHandleStyle: { color: textPrimaryColor, opacity: 0.5 },
                            dataBackground: { 
                                lineStyle: { color: gridColor, opacity: 0.8 }, 
                                areaStyle: { color: gridColor, opacity: 0.5 } 
                            },
                            selectedDataBackground: { 
                                lineStyle: { color: textColor, opacity: 0.8 }, 
                                areaStyle: { color: textColor, opacity: 0.2 } 
                            }
                        }
                    ],
                    xAxis: {
                        type: 'category',
                        data: labels,
                        axisLabel: {
                            color: textColor,
                            hideOverlap: true,
                            showMinLabel: true,
                            showMaxLabel: true,
                            formatter: function(value, index) {
                                if (!value) return '';
                                var match = value.match(/\s(\d{2}):\d{2}$/);
                                if (!match) return value;
                                return value;
                            }
                        },
                        axisTick: { show: false },
                        axisLine: { show: false },
                        splitLine: { show: false }
                    },
                    yAxis: {
                        type: 'value',
                        splitLine: {
                            lineStyle: { type: 'dashed', color: gridColor }
                        },
                        axisLabel: { color: textColor, formatter: window.formatEnergyValue }
                    },
                    series: seriesData
                };
                myChart.setOption(option);
                
                myChart.getZr().on('click', function(params) {
                    var pointInPixel = [params.offsetX, params.offsetY];
                    if (myChart.containPixel('grid', pointInPixel)) {
                        var pointInGrid = myChart.convertFromPixel({seriesIndex: 0}, pointInPixel);
                        var xIndex = pointInGrid[0];
                        
                        myChart.setOption({
                            series: [{
                                id: 'primaryLine',
                                markLine: {
                                    data: [
                                        {
                                            xAxis: xIndex,
                                            label: { show: false },
                                            lineStyle: { color: textColor, type: 'dashed', width: 2, opacity: 0.7 }
                                        }
                                    ],
                                    symbol: ['none', 'none'],
                                    animation: false
                                }
                            }]
                        });

                        var capacity = {{ .Location.EffectiveCapacityWatts }};
                        if (capacity <= 0) return;

                        var sum = 0;
                        var count = 0;
                        
                        seriesData.forEach(function(s) {
                            if (s.type === 'line' && !s.name.includes('Band')) {
                                var d = s.data[xIndex];
                                var val = (d && typeof d === 'object') ? d.value : d;
                                if (val !== null && val !== undefined && val !== 'null' && !isNaN(val)) {
                                    sum += (val / capacity);
                                    count++;
                                }
                            }
                        });
                        
                        var timestamps = {{ .Timestamps | toJSON }};
                        var timestamp = timestamps[xIndex];
                        var label = labels[xIndex];
                        
                        var fraction = 0.15;
                        if (count > 0) {
                            fraction = sum / count;
                            if (fraction < 0.15) fraction = 0.15;
                            if (fraction > 1.0) fraction = 1.0;
                        }

                        document.dispatchEvent(new CustomEvent('timeSelected', {
                            detail: {
                                timestamp: timestamp,
                                label: label,
                                fraction: fraction
                            }
                        }));
                    }
                });

                var ro = new ResizeObserver(() => { 
                    if (myChart && chartDom.clientWidth > 0 && chartDom.clientHeight > 0) {
                        myChart.resize(); 
                    }
                });
                ro.observe(chartDom);
            })();
        </script>
    {{ end }}

{{ if not .SkipMap }}
<div id="map-panel" hx-swap-oob="innerHTML">
{{ template "map_component" . }}
</div>
{{ end }}
