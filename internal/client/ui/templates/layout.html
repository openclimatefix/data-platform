{{ define "header" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Platform Overview</title>
    <!-- TODO(vendor-tracking): assets in static/ are manually vendored; checksums + a download
         target are deferred (see ARCHITECTURE.md). -->
    <link rel="stylesheet" href="/static/flatpickr.min.css">
    <link rel="stylesheet" href="/static/app.css">
    <!-- defer keeps document parsing unblocked (echarts.min.js alone is ~1MB); order among
         deferred scripts is preserved, and all run before DOMContentLoaded/htmx's own init. -->
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/flatpickr.min.js" defer></script>
    <script src="/static/echarts.min.js" defer></script>
    <script src="/static/app.js" defer></script>
    <script src="/static/forecast-chart.js" defer></script>
    <script src="/static/map.js" defer></script>
    <script src="/static/capacity-chart.js" defer></script>
</head>
<body hx-boost="true">
    <header>
        <h1>Data Platform UI</h1>
        <nav>
            <a href="/">Forecasts</a>
            <a href="/locations">Locations</a>
        </nav>
    </header>
{{ end }}

{{ define "footer" }}
</body>
</html>
{{ end }}
