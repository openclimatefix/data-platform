<form hx-get="/components/forecast" hx-target="#chart-panel" hx-indicator="#loading">
    <div class="panel-header" style="margin-bottom: 1rem;">
        <strong>Query Configuration</strong>
    </div>

    <div class="form-grid">
        <div class="form-group">
            <label for="location">Location</label>
            <select id="location" name="location_uuid" required style="width: 100%;">
                <option value="" disabled selected>Select a location</option>
                {{ range .Locations }}
                <option value="{{ .LocationUuid }}">{{ .LocationName }} ({{ .EffectiveCapacityWatts }}W)</option>
                {{ end }}
            </select>
        </div>

            <div class="form-group">
                <label for="forecaster">Forecaster</label>
                <select id="forecaster" name="forecaster" required style="width: 100%;">
                    <option value="" disabled selected>Select a forecaster</option>
                    {{ range .Forecasters }}
                    <option value="{{ .ForecasterName }}|{{ .ForecasterVersion }}">{{ .ForecasterName }} (v{{ .ForecasterVersion }})</option>
                    {{ end }}
                </select>
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="energy_source">Energy Source (Int ID)</label>
                <input type="number" id="energy_source" name="energy_source" value="1" required style="width: 100%;">
                <small style="color: var(--nc-text-2);"><i>1 = Solar, 2 = Wind etc.</i></small>
            </div>
            <div class="form-group">
                <label for="horizon_mins">Horizon Minutes</label>
                <input type="number" id="horizon_mins" name="horizon_mins" value="60" required style="width: 100%;">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="start_time">Start Time (UTC)</label>
                <input type="datetime-local" id="start_time" name="start_time" value="{{ .DefaultStart }}" required style="width: 100%;">
            </div>
            <div class="form-group">
                <label for="end_time">End Time (UTC)</label>
                <input type="datetime-local" id="end_time" name="end_time" value="{{ .DefaultEnd }}" required style="width: 100%;">
            </div>
        </div>
    <div style="margin-top: 1rem;">
        <button type="submit">View Forecast</button>
        <span id="loading" class="htmx-indicator" style="margin-left: 1rem; color: var(--nc-text-2);"><i>Fetching data...</i></span>
    </div>
</form>
