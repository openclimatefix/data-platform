<form id="query-form" hx-get="/components/forecast" hx-target="#chart-panel" hx-indicator="#loading" class="m-0">
    <div class="panel-header mb-md">
        <strong>Query Configuration</strong>
        {{ if .DashboardMode }}
        <a href="javascript:void(0)" onclick="document.getElementById('config-body').style.display = document.getElementById('config-body').style.display === 'none' ? 'block' : 'none'" class="text-small" style="color: var(--nc-ac-1); text-decoration: none;">[Expand/Collapse]</a>
        {{ end }}
    </div>

    <div id="config-body" {{ if .DashboardMode }}style="display: none;"{{ end }}>
        <div class="form-grid">
        <div class="form-group">
            <label for="location_search">Location</label>
            <input type="text" list="location_options" id="location_search" autocomplete="off" placeholder="Search by name, type, or capacity..." required>
            <input type="hidden" id="location_uuid" name="location_uuid" required>
            <datalist id="location_options">
                {{ range .Locations }}
                <option data-uuid="{{ .LocationUuid }}" value="{{ .LocationName }} ({{ .LocationType }}, {{ formatCapacity .EffectiveCapacityWatts }})"></option>
                {{ end }}
            </datalist>
        </div>

        <div class="form-group">
            <label for="source_search">Data Sources</label>
            <div class="flex-row gap-sm pos-rel">
                <div class="pos-rel flex-grow">
                    <input type="text" list="source_options" id="source_search" autocomplete="off" placeholder="Add a forecaster or observer...">
                    <datalist id="source_options">
                        {{ range .Forecasters }}
                        <option data-type="forecaster" data-val="{{ .ForecasterName }}|{{ .ForecasterVersion }}" value="{{ .ForecasterName }} (v{{ .ForecasterVersion }}) [Forecaster]"></option>
                        {{ end }}
                        {{ range .Observers }}
                        <option data-type="observer" data-val="{{ .ObserverName }}" value="{{ .ObserverName }} [Observer]"></option>
                        {{ end }}
                    </datalist>
                </div>
                <div class="pos-rel">
                    <button type="button" id="source_badge" class="btn btn-outline" onclick="document.getElementById('source_chips').classList.toggle('show')">0 Selected</button>
                    <div id="source_chips" class="custom-dropdown">
                        <div class="flex-1">
                            <strong class="dropdown-section-title">Forecasters</strong>
                            <div id="fc_chips_container" class="flex-col gap-sm"></div>
                        </div>
                        <div class="flex-1">
                            <strong class="dropdown-section-title">Observers</strong>
                            <div id="obs_chips_container" class="flex-col gap-sm"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="source_hidden_inputs"></div>
        </div>
    </div>

    <template id="chip_template">
        <div class="chip">
            <span class="chip-text" style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap;"></span>
            <span class="chip-close" style="cursor:pointer; font-weight:bold; opacity:0.8; flex-shrink: 0;">&times;</span>
        </div>
    </template>

    <script>
        (function() {
            // --- Location Datalist Mapper ---
            var locSearch = document.getElementById('location_search');
            var locUuid = document.getElementById('location_uuid');

            locSearch.addEventListener('input', e => {
                locUuid.value = ''; // Reset actual value when typing
                var options = Array.from(document.getElementById(e.target.getAttribute('list')).options);
                var opt = options.find(o => o.value === e.target.value);
                if (opt) {
                    locUuid.value = opt.getAttribute('data-uuid');
                }
            });

            // --- Multi-Select Chips from Datalist ---
            var sourceSearch = document.getElementById('source_search');
            var fcChipsContainer = document.getElementById('fc_chips_container');
            var obsChipsContainer = document.getElementById('obs_chips_container');
            var sourceHiddenInputs = document.getElementById('source_hidden_inputs');
            var sourceBadge = document.getElementById('source_badge');
            var chipTemplate = document.getElementById('chip_template');
            var selectedSources = { forecaster: [], observer: [] };

            function updateSourceBadge() {
                var total = selectedSources.forecaster.length + selectedSources.observer.length;
                sourceBadge.textContent = total + ' Selected';
                if (total === 0) {
                    document.getElementById('source_chips').classList.remove('show');
                }
            }

            function addSource(type, val, text, optNode) {
                if (!selectedSources[type].find(f => f.val === val)) {
                    selectedSources[type].push({val, text, type});
                    
                    var chipFrag = chipTemplate.content.cloneNode(true);
                    var chip = chipFrag.querySelector('.chip');
                    chip.id = 'chip_' + type + '_' + val.replace(/\|/g, '-');
                    
                    var chipText = chip.querySelector('.chip-text');
                    chipText.textContent = text.replace(' [' + (type === 'forecaster' ? 'Forecaster' : 'Observer') + ']', '');
                    chipText.title = text;
                    
                    var chipClose = chip.querySelector('.chip-close');
                    chipClose.onclick = function(event) { window.removeSource(type, val, event); };
                    
                    if (type === 'forecaster') {
                        fcChipsContainer.appendChild(chipFrag);
                    } else {
                        obsChipsContainer.appendChild(chipFrag);
                    }

                    var hid = document.createElement('input');
                    hid.type = 'hidden'; hid.name = type; hid.value = val;
                    hid.id = 'hidden_' + type + '_' + val.replace(/\|/g, '-');
                    sourceHiddenInputs.appendChild(hid);

                    updateSourceBadge();
                    if (optNode) optNode.remove();
                }
            }

            sourceSearch.addEventListener('input', e => {
                var inputVal = e.target.value;
                var listEl = document.getElementById(e.target.getAttribute('list'));
                if (!listEl) return;
                var options = Array.from(listEl.options);
                var opt = options.find(o => o.value === inputVal);
                
                if (opt) {
                    var type = opt.getAttribute('data-type');
                    var val = opt.getAttribute('data-val');
                    addSource(type, val, opt.value, opt);
                    sourceSearch.value = '';
                }
            });

            window.removeSource = function(type, val, event) {
                if (event) event.stopPropagation();
                var removedItem = selectedSources[type].find(f => f.val === val);
                if (removedItem) {
                    var opt = document.createElement('option');
                    opt.setAttribute('data-type', removedItem.type);
                    opt.setAttribute('data-val', removedItem.val);
                    opt.value = removedItem.text;
                    document.getElementById('source_options').appendChild(opt);
                }
                
                selectedSources[type] = selectedSources[type].filter(f => f.val !== val);
                document.getElementById('chip_' + type + '_' + val.replace(/\|/g, '-')).remove();
                document.getElementById('hidden_' + type + '_' + val.replace(/\|/g, '-')).remove();
                updateSourceBadge();
            };

            if (!window.dropdownClickListenerAdded) {
                document.addEventListener('click', e => {
                    var badge = document.getElementById('source_badge');
                    var chips = document.getElementById('source_chips');
                    if (!badge || !chips) return;
                    if (!e.target.closest('#source_badge') && !e.target.closest('#source_chips')) {
                        chips.classList.remove('show');
                    }
                });
                window.dropdownClickListenerAdded = true;
            }

            document.getElementById('source_badge').addEventListener('click', e => e.stopPropagation());

            document.getElementById('query-form').addEventListener('htmx:beforeRequest', function(e) {
                if (!document.getElementById('location_uuid').value) {
                    e.preventDefault();
                    alert('Please select a valid location from the list.');
                    return;
                }
                if (selectedSources.forecaster.length === 0 && selectedSources.observer.length === 0) {
                    e.preventDefault();
                    alert('Please select at least one forecaster or observer.');
                }
            });

            {{ if .DashboardMode }}
            setTimeout(function() {
                var locSearchInput = document.getElementById('location_search');
                var locUuidInput = document.getElementById('location_uuid');
                var listEl = document.getElementById('location_options');
                if (listEl) {
                    var options = Array.from(listEl.options);
                    var opt = options.find(o => o.getAttribute('data-uuid') === "{{ .DefaultLocationUUID }}");
                    if (opt) {
                        locSearchInput.value = opt.value;
                        locUuidInput.value = opt.getAttribute('data-uuid');
                    }
                }

                var soList = document.getElementById('source_options');
                if (soList) {
                    var sOptions = Array.from(soList.options);
                    var fOpt = sOptions.find(o => o.getAttribute('data-type') === 'forecaster' && o.getAttribute('data-val').startsWith('blend'));
                    if (fOpt) addSource('forecaster', fOpt.getAttribute('data-val'), fOpt.value, fOpt);
                    
                    var oOpt1 = sOptions.find(o => o.getAttribute('data-type') === 'observer' && o.getAttribute('data-val') === 'pvlive_in_day');
                    if (oOpt1) addSource('observer', oOpt1.getAttribute('data-val'), oOpt1.value, oOpt1);
                    
                    var oOpt2 = sOptions.find(o => o.getAttribute('data-type') === 'observer' && o.getAttribute('data-val') === 'pvlive_day_after');
                    if (oOpt2) addSource('observer', oOpt2.getAttribute('data-val'), oOpt2.value, oOpt2);
                }
                
                htmx.trigger('#query-form', 'submit');
            }, 50);
            {{ end }}
        })();
    </script>

    <div class="params-grid">
        <div class="form-group">
            <label for="energy_source">Energy Source</label>
            <select id="energy_source" name="energy_source" required>
                <option value="1" selected>Solar</option>
                <option value="2">Wind</option>
            </select>
        </div>
        <div class="form-group">
            <label for="horizon_mins">Horizon Mins</label>
            <input type="number" id="horizon_mins" name="horizon_mins" value="0" min="0" max="2160" step="5" required>
        </div>
        <div class="form-group">
            <label for="time_window">Time Window (UTC)</label>
            <input type="text" id="time_window" name="time_window" value="{{ .DefaultTimeWindow }}" required>
        </div>
    </div>
    <div class="mt-md">
        <button type="submit" class="btn">View Forecast</button>
        <span id="loading" class="htmx-indicator text-muted" style="margin-left: 1rem;"><i>Fetching data...</i></span>
    </div>
</div>
</form>

<script>
    flatpickr("#time_window", {
        mode: "range",
        enableTime: true,
        time_24hr: true,
        dateFormat: "Y-m-d H:i",
    });
</script>
