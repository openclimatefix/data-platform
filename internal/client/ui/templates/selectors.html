<form hx-get="/components/forecast" hx-target="#chart-panel" hx-indicator="#loading">
    <div class="panel-header" style="margin-bottom: 1rem;">
        <strong>Query Configuration</strong>
    </div>

    <div class="form-grid">
        <div class="form-group">
            <label for="location_search">Location</label>
            <input type="text" list="location_options" id="location_search" autocomplete="off" placeholder="Search by name, type, or capacity..." required>
            <input type="hidden" id="location_uuid" name="location_uuid" required>
            <datalist id="location_options">
                {{ range .Locations }}
                <option data-uuid="{{ .LocationUuid }}" value="{{ .LocationName }} ({{ .LocationType }}, {{ formatCapacity .EffectiveCapacityWatts }})"></option>
                {{ end }}
            </datalist>
        </div>

        <div class="form-group">
            <label for="source_search">Data Sources</label>
            <div style="display: flex; gap: 8px; position: relative;">
                <div style="position: relative; flex-grow: 1;">
                    <input type="text" list="source_options" id="source_search" autocomplete="off" placeholder="Add a forecaster or observer...">
                    <datalist id="source_options">
                        {{ range .Forecasters }}
                        <option data-type="forecaster" data-val="{{ .ForecasterName }}|{{ .ForecasterVersion }}" value="{{ .ForecasterName }} (v{{ .ForecasterVersion }}) [Forecaster]"></option>
                        {{ end }}
                        {{ range .Observers }}
                        <option data-type="observer" data-val="{{ .ObserverName }}" value="{{ .ObserverName }} [Observer]"></option>
                        {{ end }}
                    </datalist>
                </div>
                <div style="position: relative;">
                    <button type="button" id="source_badge" class="badge-btn" onclick="document.getElementById('source_chips').classList.toggle('show')">0 Selected</button>
                    <div id="source_chips" class="custom-dropdown" style="right: 0; left: auto; width: 350px; padding: 12px; flex-direction: row; gap: 16px;">
                        <div style="flex: 1; min-width: 0;">
                            <strong style="font-size: 0.85rem; color: var(--nc-text-2); margin-bottom: 8px; display: block; border-bottom: 1px solid var(--nc-bg-3); padding-bottom: 4px;">Forecasters</strong>
                            <div id="fc_chips_container" style="display: flex; flex-direction: column; gap: 6px;"></div>
                        </div>
                        <div style="flex: 1; min-width: 0;">
                            <strong style="font-size: 0.85rem; color: var(--nc-text-2); margin-bottom: 8px; display: block; border-bottom: 1px solid var(--nc-bg-3); padding-bottom: 4px;">Observers</strong>
                            <div id="obs_chips_container" style="display: flex; flex-direction: column; gap: 6px;"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="source_hidden_inputs"></div>
        </div>
    </div>

    <script>
        // --- Location Datalist Mapper ---
        const locSearch = document.getElementById('location_search');
        const locUuid = document.getElementById('location_uuid');

        locSearch.addEventListener('input', e => {
            locUuid.value = ''; // Reset actual value when typing
            const options = Array.from(document.getElementById(e.target.getAttribute('list')).options);
            const opt = options.find(o => o.value === e.target.value);
            if (opt) {
                locUuid.value = opt.getAttribute('data-uuid');
            }
        });

        // --- Multi-Select Chips from Datalist ---
        const sourceSearch = document.getElementById('source_search');
        const fcChipsContainer = document.getElementById('fc_chips_container');
        const obsChipsContainer = document.getElementById('obs_chips_container');
        const sourceHiddenInputs = document.getElementById('source_hidden_inputs');
        const sourceBadge = document.getElementById('source_badge');
        let selectedSources = { forecaster: [], observer: [] };

        function updateSourceBadge() {
            const total = selectedSources.forecaster.length + selectedSources.observer.length;
            sourceBadge.textContent = total + ' Selected';
            if (total === 0) {
                document.getElementById('source_chips').classList.remove('show');
            }
        }

        sourceSearch.addEventListener('input', e => {
            const inputVal = e.target.value;
            const options = Array.from(document.getElementById(e.target.getAttribute('list')).options);
            const opt = options.find(o => o.value === inputVal);
            
            if (opt) {
                const type = opt.getAttribute('data-type');
                const val = opt.getAttribute('data-val');
                const text = opt.value;
                
                if (!selectedSources[type].find(f => f.val === val)) {
                    selectedSources[type].push({val, text, type});
                    
                    // Add chip to popover
                    const chip = document.createElement('div');
                    chip.className = 'chip';
                    chip.id = 'chip_' + type + '_' + val.replace(/\|/g, '-');
                    chip.innerHTML = `<span style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap;" title="${text}">${text.replace(' [' + (type === 'forecaster' ? 'Forecaster' : 'Observer') + ']', '')}</span><span style="cursor:pointer; font-weight:bold; opacity:0.8; flex-shrink: 0;" onclick="removeSource('${type}', '${val}', event)">&times;</span>`;
                    
                    if (type === 'forecaster') {
                        fcChipsContainer.appendChild(chip);
                    } else {
                        obsChipsContainer.appendChild(chip);
                    }

                    // Add hidden input for form submission
                    const hid = document.createElement('input');
                    hid.type = 'hidden';
                    hid.name = type;
                    hid.value = val;
                    hid.id = 'hidden_' + type + '_' + val.replace(/\|/g, '-');
                    sourceHiddenInputs.appendChild(hid);

                    updateSourceBadge();
                    
                    // Remove option from datalist so it can't be selected again
                    opt.remove();
                }
                
                sourceSearch.value = ''; // Reset input after selection
            }
        });

        window.removeSource = function(type, val, event) {
            if (event) event.stopPropagation();
            
            // Re-add to datalist
            const removedItem = selectedSources[type].find(f => f.val === val);
            if (removedItem) {
                const opt = document.createElement('option');
                opt.setAttribute('data-type', removedItem.type);
                opt.setAttribute('data-val', removedItem.val);
                opt.value = removedItem.text;
                document.getElementById('source_options').appendChild(opt);
            }
            
            selectedSources[type] = selectedSources[type].filter(f => f.val !== val);
            document.getElementById('chip_' + type + '_' + val.replace(/\|/g, '-')).remove();
            document.getElementById('hidden_' + type + '_' + val.replace(/\|/g, '-')).remove();
            updateSourceBadge();
        };

        // Close dropdowns when clicking outside
        document.addEventListener('click', e => {
            if (!e.target.closest('#source_badge') && !e.target.closest('#source_chips')) {
                document.getElementById('source_chips').classList.remove('show');
            }
        });

        // Ensure clicking the badge stops propagation so the document click listener doesn't close it instantly
        document.getElementById('source_badge').addEventListener('click', function(e) {
            e.stopPropagation();
        });

        // Ensure the form only submits if validation passes
        document.getElementById('location_search').closest('form').addEventListener('submit', function(e) {
            if (!document.getElementById('location_uuid').value) {
                e.preventDefault();
                alert('Please select a valid location from the list.');
                return;
            }
            if (selectedSources.forecaster.length === 0 && selectedSources.observer.length === 0) {
                e.preventDefault();
                alert('Please select at least one forecaster or observer.');
            }
        });
    </script>

    <div style="display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 20px; margin-bottom: 20px;">
        <div class="form-group">
            <label for="energy_source">Energy Source</label>
            <select id="energy_source" name="energy_source" required>
                <option value="1" selected>Solar</option>
                <option value="2">Wind</option>
            </select>
        </div>
        <div class="form-group">
            <label for="horizon_mins">Horizon Mins</label>
            <input type="number" id="horizon_mins" name="horizon_mins" value="0" min="0" max="2160" step="5" required>
        </div>
        <div class="form-group">
            <label for="time_window">Time Window (UTC)</label>
            <input type="text" id="time_window" name="time_window" value="{{ .DefaultTimeWindow }}" required>
        </div>
    </div>
    <div style="margin-top: 1rem;">
        <button type="submit">View Forecast</button>
        <span id="loading" class="htmx-indicator" style="margin-left: 1rem; color: var(--nc-text-2);"><i>Fetching data...</i></span>
    </div>
</form>

<script>
    flatpickr("#time_window", {
        mode: "range",
        enableTime: true,
        time_24hr: true,
        dateFormat: "Y-m-d H:i",
    });
</script>
