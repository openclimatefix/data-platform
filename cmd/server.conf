// HOCON configuration file for the Data Platform.
// DO NOT EDIT this file to configure the application! Use the specified environmant variables.

// The port on which to run the gRPC server
port = 50051
port = ${?PORT}

ui_port = 8080
ui_port = ${?UI_PORT}

// The logging level of the application
loglevel = "INFO"
loglevel = ${?LOGLEVEL}

// The connection string of the database
// NOTE: Only postgresql:// schemes are currently supported.
dburl = "fake"
dburl = ${?DATABASE_URL}
