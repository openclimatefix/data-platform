syntax = "proto2";

package ocf.dp;

import "buf/validate/validate.proto";

option go_package = "github.com/openclimatefix/data-platform/internal/protogen/ocf/dp;dp";

extend buf.validate.StringRules {
 optional bool valid_location_name = 4457818 [(buf.validate.predefined).cel = {
   id: "string.valid.locationname",
   message: "Required field, 2-100 chars long; lowercase, alphanumeric and underscores and pipes only",
   expression: "this.size() >= 2 && this.size() <= 100 && this.matches(\'^[a-z0-9_|]+$\')"
 }];
} 

extend buf.validate.StringRules {
 optional bool valid_forecaster_name = 4457819 [(buf.validate.predefined).cel = {
   id: "string.valid.forecastername",
   message: "Required field, 2-100 chars long; alphanumeric, lowercase, hyphens, underscores, and periods only",
   expression: "this.size() >= 2 && this.size() <= 100 && this.matches('^[a-z0-9.-_]+$')"
 }];
} 

extend buf.validate.StringRules {
 optional bool valid_observer_name = 4457820 [(buf.validate.predefined).cel = {
   id: "string.valid.observername",
   message: "Required field, 2-100 chars long; alphanumeric, lowercase, and underscores only",
   expression: "this.size() >= 2 && this.size() <= 100 && this.matches(\'^[a-z0-9_]+$\')"
 }];
} 

extend buf.validate.StringRules {
 optional bool valid_geometry = 4457821 [(buf.validate.predefined).cel = {
   id: "string.valid.geometry",
   message: "Required field, valid geomeetry in Well-Known Text (WKT) format",
   expression: "this.size() >= 10" // TODO: Determine proper regex for this
 }];
}

