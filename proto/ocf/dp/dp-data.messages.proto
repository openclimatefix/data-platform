message CreateForecastRequest {
  message ForecastValue {
    uint32 horizon_mins = 1;
    float p50_fraction = 2 [
      (buf.validate.field).float.gte = 0,
      (buf.validate.field).float.lte = 1.1,
      (buf.validate.field).float.finite = true
    ];
    // Struct for storing additional statistics like p10, p90, mean etc.
    map<string, float> other_statistics_fractions = 3 [
      (buf.validate.field).map.min_pairs = 0,
      (buf.validate.field).map.max_pairs = 20,
      (buf.validate.field).map.values = {
        float: {
          gte: 0.0,
          lte: 1.1,
          finite: true
        }
      }
    ];
    optional google.protobuf.Struct metadata = 4;
  }

  Forecaster forecaster = 1 [
    (buf.validate.field).required = true
  ];

  string location_uuid = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  EnergySource energy_source = 3 [
    (buf.validate.field).required = true
  ];

  google.protobuf.Timestamp init_time_utc = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp = { gt: { seconds: 112000000}, lt_now: true }
  ];

  repeated CreateForecastRequest.ForecastValue values = 5 [
    (buf.validate.field).repeated.min_items = 2,
    (buf.validate.field).repeated.max_items = 5000
  ];

  optional google.protobuf.Struct metadata = 6;

  //option (buf.validate.message).cel = {
  //  id: "forecast.values.monotonic_horizons"
  //  message: "Forecast horizon values must be monotonically increasing"
  //  expression:
  //    "this.values.all(i, v, "
  //      "i == 0 || ("
  //        "v.horizon_mins > this.values[i-1].horizon_mins && "
  //        "(v.horizon_mins - this.values[i-1].horizon_mins == this.values[1].horizon_mins - this.values[0].horizon_mins)"
  //      ")"
  //    ")"
  //};
}

message CreateForecastResponse {
  string forecast_uuid = 1;
}


