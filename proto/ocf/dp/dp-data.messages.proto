message GetWeekAverageDeltasRequest {
  string location_uuid = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  EnergySource energy_source = 2 [
    (buf.validate.field).required = true 
  ];
  /* The characteristic time to detrmine averages for.
   * The time component specifies the initialization time,
   * and the date component is to define the end of the seven-day period
   * over which to average.
   */
  google.protobuf.Timestamp pivot_timestamp_utc = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp = { gt: { seconds: 112000000}, lt_now: true }
  ];
  Forecaster forecaster = 4 [
    (buf.validate.field).required = true
  ];
  string observer_name = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(valid_observer_name) = true
  ];
}

message GetWeekAverageDeltasResponse {
  message AverageDelta {
    uint32 horizon_mins = 1;
    float delta_fraction = 2;
    uint64 effective_capacity_watts = 3;
  }

  repeated AverageDelta deltas = 1;
  /* The initialisation time that was compared across the week.
   * Formatted as HH:MM, e.g. "12:00"
   */
  string init_time_of_day = 2 [
    (buf.validate.field).string.pattern = "^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$"
  ];
}

message ListLocationsRequest {
  // Optional filter to only return locations of a specific energy source.
  optional EnergySource energy_source_filter = 1;
  // Optional filter to only return locations of a specific location type.
  optional LocationType location_type_filter = 2;
  // Optional filter to only return locations from a given set.
  repeated string location_uuids_filter = 3 [
    (buf.validate.field).repeated.max_items = 1000,
    (buf.validate.field).repeated.items = {
      string: {uuid: true}
    }
  ];
  // Optional filter to only return locations belonging to a specific user.
  optional string user_oauth_id_filter = 4 [
    (buf.validate.field).string.max_len = 128
  ];
  // Optional filter to only return locations for which the user has a specific permission.
  optional Permission permission_filter = 5;
  // Optional filter to only return locations enclosed within a specific location.
  optional string enclosing_location_uuid_filter = 6 [
    (buf.validate.field).string.uuid = true
  ];
  // Optional filter to only return locations that enclose a specific location.
  optional string enclosed_location_uuid_filter = 7 [
    (buf.validate.field).string.uuid = true
  ];


  option (buf.validate.message).cel = {
    id: "enclosing_and_enclosed_mutually_exclusive"
    message: "enclosing_location_uuid_filter and enclosed_location_uuid_filter cannot both be set"
    expression:
      "!(has(this.enclosing_location_uuid_filter) && has(this.enclosed_location_uuid_filter))"
  };
}

message ListLocationsResponse {
  message LocationSummary {
    string location_uuid = 1;
    string location_name = 2;
    EnergySource energy_source = 3;
    LocationType location_type = 4;
    uint64 effective_capacity_watts = 5;
    LatLng latlng = 6;
    google.protobuf.Struct metadata = 7;
  }

  repeated LocationSummary locations = 1;
}


message StreamForecastDataRequest {
  message TimeWindow {
    /* The start of the time window, inclusive.
     * Cannot be more than 31 days before end_timestamp_utc.
     */
    google.protobuf.Timestamp start_timestamp_utc = 1 [
      (buf.validate.field).required = true,
      (buf.validate.field).timestamp = { gt: { seconds: 112000000}, lt_now: true }
    ];
    /* The end of the time window, inclusive.
     * Cannot be more than 31 days after start_timestamp_utc.
     */
    google.protobuf.Timestamp end_timestamp_utc = 2 [
      (buf.validate.field).required = true,
      (buf.validate.field).timestamp.gt = { seconds: 112000000}
    ];

    option (buf.validate.message).cel = {
      id: "maximum_window_size"
      message: "window size must not exceed 31 days"
      expression: "this.end_timestamp_utc - this.start_timestamp_utc <= duration('2678400s')"
    };
    option (buf.validate.message).cel = {
      id: "start_before_end"
      message: "start_timestamp_utc must be before end_timestamp_utc"
      expression: "this.start_timestamp_utc <= this.end_timestamp_utc"
    };
  }

  string location_uuid = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  EnergySource energy_source = 2 [
    (buf.validate.field).required = true 
  ];
  StreamForecastDataRequest.TimeWindow time_window = 3 [
    (buf.validate.field).required = true
  ];
  repeated Forecaster forecasters = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 20
  ];
  bool include_metadata = 5;
}

message StreamForecastDataResponse {
  google.protobuf.Timestamp init_timestamp = 1;
  string location_uuid = 2;
  string forecaster_fullname = 3;
  uint32 horizon_mins = 4;
  float p50_fraction = 5;
  map<string, float> other_statistics_fractions = 6;
  google.protobuf.Timestamp created_timestamp_utc = 7;
  uint64 effective_capacity_watts = 8;
  map<string, string> metadata = 9;
}

