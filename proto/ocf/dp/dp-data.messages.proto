message DeleteForecastResponse {}


message CreateLocationRequest {
  string location_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(valid_location_name) = true
  ];
  EnergySource energy_source = 2 [
    (buf.validate.field).required = true 
  ];
  // A geometry string in Well-Known-Text (WKT) format.
  // Geometry type must be POINT, POLYGON, or MULTIPOLYGON, must have 2 dimensions,
  // and must be in the EPSG:4326 coordinate system (longitude/latitude).
  string geometry_wkt = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(valid_geometry) = true,
    (buf.validate.field).string.example = "POLYGON ((-0.127 51.507, -0.127 51.507, -0.127 51.507, -0.127 51.507))"
  ];
  // The effective capacity of the location in watts.
  // This refers to the useable capacity for generation, not the installed capacity.
  // If tracking of installed capacity is required, this should be stored in metadata.
  uint64 effective_capacity_watts = 4 [
    (buf.validate.field).required = true
  ];
  LocationType location_type = 5 [
    (buf.validate.field).required = true 
  ];
  optional google.protobuf.Struct metadata = 6;
  // The UTC time from which this location is considered valid. Leave empty to use current time.
  optional google.protobuf.Timestamp valid_from_utc = 7 [
    (buf.validate.field).timestamp = { gt: { seconds: 112000000}, lt_now: true }
  ];
  // Optional latitude/longitude to associate with the location.
  // Defaults to the centroid of the geometry if not provided. Not required for Point geometries.
  optional LatLng associated_latlng = 8;

  option (buf.validate.message).cel = {
    id: "latlng_invalid_for_point"
    message: "latlng must not be provided for Point geometries"
    expression:
      "this.geometry_wkt.startsWith('POINT') ? !has(this.associated_latlng) : true"
  };
}

message CreateLocationResponse {
  string location_uuid = 1;
  string location_name = 2;
  uint64 effective_capacity_watts = 3;
}


message GetLocationRequest {
  string location_uuid = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  EnergySource energy_source = 2[
    (buf.validate.field).required = true 
  ];
  // If true, the geometry_wkb field will be included in the response.
  // This may be very big, so only include if necessary.
  bool include_geometry = 3;
  // The UTC time the data should be valid for. Leave empty to use current time.
  optional google.protobuf.Timestamp pivot_timestamp_utc = 4 [
    (buf.validate.field).timestamp = { gt: { seconds: 112000000}, lt_now: true }
  ];
}

message GetLocationResponse {
  string location_uuid = 1;
  string location_name = 2;
  LatLng latlng = 3;
  uint64 effective_capacity_watts = 4;
  google.protobuf.Struct metadata = 5;
  optional bytes geometry_wkb = 6;
}

message UpdateLocationRequest {
  string location_uuid = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  EnergySource energy_source = 2 [
    (buf.validate.field).required = true 
  ];
  // The new name for the location.
  optional string new_location_name = 3 [
    (buf.validate.field).string.(valid_location_name) = true
  ];
  optional uint64 new_effective_capacity_watts = 4 [
    (buf.validate.field).uint64.gte = 0
  ];
  // The new metadata object to set for the location.
  // Note that this will replace any existing metadata, so be sure to include existing fields where
  // needed.
  optional google.protobuf.Struct new_metadata = 5;
  // The UTC time from which this name is considered valid. Leave empty to use current time.
  optional google.protobuf.Timestamp valid_from_utc = 6 [
    (buf.validate.field).timestamp = { gt: { seconds: 112000000}, lt_now: true }
  ];

  // Ensure one of the updatable fields is set.
  option (buf.validate.message).cel = {
    id: "at_least_one_field"
    message: "at least one updatable field must be set"
    expression: 
        "has(this.new_location_name) "
        "|| has(this.new_effective_capacity_watts) "
        "|| has(this.new_metadata) ? true : false" 
  };
}

message UpdateLocationResponse {
  string location_uuid = 1;
  string location_name = 2;
  uint64 effective_capacity_watts = 3;
}

